<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Content-Security-Policy: 依存ライブラリが汚染されても、通信先を Supabase・CDN・Turnstile だけに限定します。
     ※ Supabase の URL を変更したら、下の connect-src のドメインも必ず合わせて変更してください。
     ※ challenges.cloudflare.com は Turnstile 用です（script/connect/frame）。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'unsafe-inline';
  style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
  font-src https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src https://xuekmypfzxszpmmqmfsl.supabase.co wss://xuekmypfzxszpmmqmfsl.supabase.co https://challenges.cloudflare.com;
  frame-src https://challenges.cloudflare.com;
  base-uri 'none';
  form-action 'none';
" />
<title>1日1ぬい</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#efeaf6; --bg-2:#f6f1f9; --surface:#fffdf9; --ink:#4c4356; --muted:#9a8fa8;
    --berry:#e5738e; --berry-dk:#cf5c78; --sage:#8ab59b; --stitch:#d9c2e4;
    --line:#e7dced; --radius:22px; --shadow:0 10px 30px rgba(90,60,110,.10);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #fbeef4 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #e9f3ec 0%, transparent 50%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  }
  .wrap{max-width:620px;margin:0 auto;padding:34px 18px 80px}
  header{text-align:center;margin-bottom:26px}
  .title{font-size:32px;font-weight:800;letter-spacing:.06em;margin:0}
  .title .dot{color:var(--berry)}
  .subtitle{margin:6px 0 0;color:var(--muted);font-size:14px;letter-spacing:.04em}

  .banner{display:none;background:#fff4f6;border:2px dashed var(--berry);color:var(--berry-dk);
    border-radius:16px;padding:14px 16px;margin-bottom:20px;font-size:14px}
  .banner.show{display:block}
  .banner code{background:#fde7ec;padding:1px 6px;border-radius:6px;font-size:13px}

  .felt{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;padding:24px 22px}
  .felt::after{content:"";position:absolute;inset:7px;border:2px dashed var(--stitch);
    border-radius:calc(var(--radius) - 9px);pointer-events:none}

  .draw{margin-bottom:20px}
  label.field-label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px 2px;letter-spacing:.05em}
  .name-input{width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;
    padding:14px 16px;font-family:var(--font);font-size:18px;color:var(--ink);outline:none;transition:border-color .15s}
  .name-input:focus{border-color:var(--berry)}
  .name-input::placeholder{color:#c7bcd2}
  .draw-btn{margin-top:14px;width:100%;border:none;cursor:pointer;background:var(--berry);color:#fff;
    font-family:var(--font);font-weight:800;font-size:18px;letter-spacing:.08em;padding:15px 18px;border-radius:18px;
    box-shadow:0 6px 0 var(--berry-dk);transition:transform .06s,box-shadow .06s,background .15s}
  .draw-btn:hover{background:#ec7f98}
  .draw-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-dk)}
  .draw-btn:disabled{background:#d8cee2;color:#fff;box-shadow:0 6px 0 #c3b6d0;cursor:default}
  .hint{margin:12px 2px 0;font-size:12.5px;color:var(--muted);text-align:center}

  .result{margin-top:20px;display:none}
  .result.show{display:block}
  .bubble{background:linear-gradient(180deg,#fffef8,#fdf6ef);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:30px 26px 26px;position:relative;text-align:center;
    animation:pop .5s cubic-bezier(.2,1.3,.4,1) both, sway 4.5s ease-in-out .5s infinite}
  .bubble::after{content:"";position:absolute;inset:7px;border:2px dashed var(--sage);
    border-radius:calc(var(--radius) - 9px);pointer-events:none}
  .stamp{display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--sage);
    border:2px dashed var(--sage);border-radius:999px;padding:3px 12px;margin-bottom:14px}
  .sentence{font-size:22px;font-weight:700;line-height:1.85;margin:0}
  .sentence .who{color:var(--berry)}
  .locked-note{margin:14px 0 0;font-size:12.5px;color:var(--muted)}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}

  .panel{margin-top:26px}
  .panel>summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between;
    padding:15px 18px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);font-weight:700;font-size:15px}
  .panel>summary::-webkit-details-marker{display:none}
  .panel>summary .count{font-size:12px;font-weight:700;color:var(--sage);background:#eef6f0;border-radius:999px;padding:3px 11px}
  .panel[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .panel-body{background:var(--surface);border-radius:0 0 16px 16px;box-shadow:var(--shadow);padding:18px;margin-top:-6px}

  .row{display:flex;gap:8px;margin-bottom:10px}
  .row .name-input{font-size:15px;padding:11px 13px}
  .mini-btn{border:none;cursor:pointer;white-space:nowrap;background:var(--sage);color:#fff;font-family:var(--font);
    font-weight:700;font-size:14px;padding:0 16px;border-radius:14px;transition:filter .15s}
  .mini-btn:hover{filter:brightness(1.05)}
  .mini-btn.ghost{background:#fff;color:var(--muted);border:2px solid var(--line)}
  .mini-btn.berry{background:var(--berry)}
  textarea.bulk{width:100%;min-height:120px;resize:vertical;font-family:var(--font);font-size:14px;color:var(--ink);
    border:2px solid var(--line);border-radius:14px;padding:12px 13px;outline:none;line-height:1.7}
  textarea.bulk:focus{border-color:var(--sage)}
  .divider{height:1px;background:var(--line);margin:16px 0;border:0}
  .search{margin-bottom:10px}
  .list{max-height:260px;overflow-y:auto;border:2px solid var(--line);border-radius:14px;padding:6px}
  .list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14.5px}
  .list-item:hover{background:#faf6fc}
  .list-item .txt{flex:1}
  .mine-tag{font-size:11px;color:var(--sage);border:1px dashed var(--sage);border-radius:999px;padding:1px 7px}
  .del{border:none;background:transparent;cursor:pointer;color:#d6a9b7;font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
  .del:hover{background:#fbeef2;color:var(--berry)}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:18px}
  .panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .hist-item{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px}
  .hist-item:last-child{border-bottom:0}
  .hist-item .date{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .hist-item .who2{color:var(--berry);font-weight:700}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;
    z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  @media (prefers-reduced-motion:reduce){.bubble{animation:pop .3s ease both}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">1日1ぬい<span class="dot">.</span></h1>
    <p class="subtitle">今日のぬいぐるみを、そっと観察。</p>
  </header>

  <div id="banner" class="banner"></div>

  <!-- Turnstile ウィジェット。初回訪問時の匿名ログインのときだけ表示されます。 -->
  <div id="tsContainer" style="display:none;justify-content:center;margin-bottom:18px;"></div>

  <section class="felt draw">
    <label class="field-label" for="nameInput">ぬいぐるみの名前</label>
    <input id="nameInput" class="name-input" type="text" placeholder="例）くまちゃん" maxlength="24" autocomplete="off" />
    <button id="drawBtn" class="draw-btn">今日の様子を観察する</button>
    <p class="hint">名前ごとに 1日1回。押すと今日の様子を観察できます。</p>
  </section>

  <section id="result" class="result">
    <div class="bubble">
      <span class="stamp" id="resultDate">TODAY</span>
      <p class="sentence"><span id="resultText"></span><span class="who" id="resultWho"></span></p>
      <p class="locked-note" id="lockedNote"></p>
    </div>
  </section>

  <details class="panel" id="histPanel">
    <summary>これまでの観察記録 <span class="count" id="histBadge">…</span></summary>
    <div class="panel-body">
      <div id="histList"><p class="empty">読み込み中…</p></div>
      <div class="panel-actions">
        <button id="resetTodayBtn" class="mini-btn ghost">今日の記録をやり直す</button>
      </div>
    </div>
  </details>

  <footer>観察記録はあなた専用に保存されます</footer>
</div>

<div class="toast" id="toast"></div>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9/dist/umd/supabase.js"
  integrity="sha384-6foGJ1oz/y3anEo0BXRtTgBK1GvpnR0GbJZb0ijG+nBAJ4rYT+VqlD/9e3CSiFIA"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"></script>
<!-- Cloudflare Turnstile ローダー。頻繁に更新されるため SRI は付けません（CSPで配信元を限定）。 -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
/* ============================================================
   ▼ ここにあなたの Supabase プロジェクトの値を入れてください
   ============================================================ */
const SUPABASE_URL = "https://xuekmypfzxszpmmqmfsl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_a75xUa9gRXrH1cLB5sdGsw_MJ_0VThq";

/* ▼ Cloudflare Turnstile の「サイトキー」を入れてください（公開情報なので埋め込みOK）
   Secret キーは Supabase ダッシュボード側にだけ設定します。ここには入れないでください。 */
const TURNSTILE_SITEKEY = "0x4AAAAAAD__N08vFGBCb_oY";
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const todayStr = () => {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }
function banner(html){ const b=$("banner"); b.innerHTML=html; b.classList.add("show"); }
function disableDraw(){ $("drawBtn").disabled=true; }

/* ---- Cloudflare Turnstile ----
   ウィジェットを表示してトークンを1つ取得します。多くの場合は無操作（不可視）で通り、
   チャレンジが必要なときだけ画面に表示されます（appearance:'interaction-only'）。 */
function getTurnstileToken(){
  return new Promise((resolve, reject) => {
    const container = $("tsContainer");
    container.style.display = "flex";
    const render = () => {
      try {
        window.turnstile.render(container, {
          sitekey: TURNSTILE_SITEKEY,
          appearance: "interaction-only",
          callback: (token) => resolve(token),
          "error-callback": () => reject(new Error("turnstile-error")),
          "expired-callback": () => reject(new Error("turnstile-expired")),
        });
      } catch(e){ reject(e); }
    };
    if(window.turnstile && window.turnstile.render){ render(); return; }
    // ローダーがまだ読み込み中なら少し待つ
    let tries = 0;
    const iv = setInterval(() => {
      if(window.turnstile && window.turnstile.render){ clearInterval(iv); render(); }
      else if(++tries > 100){ clearInterval(iv); reject(new Error("turnstile-not-loaded")); }
    }, 100);
  });
}
function hideTurnstile(){ const c=$("tsContainer"); if(c){ c.style.display="none"; } }

let sb=null, myUid=null;
let behaviors=[];  // [{id, text, mine}]
let history=[];    // [{name, date, text}]

/* ---- init ---- */
async function init(){
  if(!window.supabase){
    banner("Supabaseライブラリの読み込みに失敗しました。ネットワーク／CDNを確認してください。");
    disableDraw(); return;
  }
  if(SUPABASE_URL.includes("YOUR-") || SUPABASE_ANON_KEY.includes("YOUR-")){
    banner("セットアップが未完了です。ファイル冒頭の <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、あなたのプロジェクトの値に置き換えてください。");
    disableDraw(); return;
  }
  if(TURNSTILE_SITEKEY.includes("YOUR-")){
    banner("セットアップが未完了です。ファイル冒頭の <code>TURNSTILE_SITEKEY</code> に、Cloudflare Turnstile のサイトキーを設定してください。");
    disableDraw(); return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 匿名ログイン（端末ごとにセッションが保存され、同じユーザーとして扱われます）
  // セッションが無い＝初回訪問のときだけ、Turnstile で人間確認してからログインします。
  let { data:{ session } } = await sb.auth.getSession();
  if(!session){
    let captchaToken;
    try {
      captchaToken = await getTurnstileToken();
    } catch(e){
      banner("人間確認（Turnstile）に失敗しました。ページを再読み込みしてください。解決しない場合は <code>TURNSTILE_SITEKEY</code> の値をご確認ください。");
      disableDraw(); return;
    }
    const { error } = await sb.auth.signInAnonymously({ options:{ captchaToken } });
    hideTurnstile();
    if(error){
      banner("匿名ログインに失敗しました。Supabase の Authentication で「Anonymous sign-ins」の有効化と、Bot and Abuse Protection の Turnstile Secret 設定をご確認ください。");
      disableDraw(); return;
    }
  }
  const { data:{ user } } = await sb.auth.getUser();
  myUid = user ? user.id : null;

  bindEvents();
  await loadBehaviors();
  await loadHistory();
}

/* ---- behaviors (shared, read-only for users) ----
   行動リストはSupabaseの behaviors テーブルで管理者が管理します。
   利用ユーザーには一覧を表示せず、抽選の元データとしてのみ読み込みます。 */
async function loadBehaviors(){
  const { data, error } = await sb.from("behaviors")
    .select("id,text").order("created_at",{ ascending:true });
  if(error){ toast("観察リストの読み込みに失敗しました"); return; }
  behaviors = (data||[]).map(r => ({ id:r.id, text:r.text }));
}

/* ---- draw (per user, 1/day/plush) ---- */
async function draw(){
  const name = $("nameInput").value.trim();
  if(!name){ toast("ぬいぐるみの名前を入れてね"); $("nameInput").focus(); return; }
  if(behaviors.length===0){ toast("観察リストが空です。管理者にお知らせください。"); return; }
  const day = todayStr();

  const { data: ex } = await sb.from("records")
    .select("text").eq("plush_name",name).eq("day",day).maybeSingle();
  if(ex){ showResult(name, ex.text, day, true); return; }

  const sentence = behaviors[Math.floor(Math.random()*behaviors.length)].text;
  const { error } = await sb.from("records").insert({ plush_name:name, day, text:sentence });
  if(error){
    // 同時実行などで既に入っていた場合は取り直して表示
    const { data: ex2 } = await sb.from("records")
      .select("text").eq("plush_name",name).eq("day",day).maybeSingle();
    if(ex2){ showResult(name, ex2.text, day, true); return; }
    toast("保存に失敗しました"); return;
  }
  await loadHistory();
  showResult(name, sentence, day, false);
}

function showResult(name, sentence, day, locked){
  $("resultWho").textContent = name;
  $("resultText").textContent = trimStop(sentence);
  $("resultDate").textContent = day.replace(/-/g,".");
  $("lockedNote").textContent = locked ? "今日はもう観察ずみ。また明日ね。" : "";
  const r=$("result"); r.classList.add("show");
  const b=r.querySelector(".bubble"); b.style.animation="none"; void b.offsetWidth; b.style.animation="";
  r.scrollIntoView({ behavior:"smooth", block:"center" });
}

/* ---- history (per user) ---- */
async function loadHistory(){
  if(!myUid){ return; }  // ユーザー未確定なら何も読まない
  const { data, error } = await sb.from("records")
    .select("plush_name,day,text")
    .eq("user_id", myUid)   // RLS任せにせず、クライアント側でも自分の記録だけに限定（多層防御）
    .order("day",{ ascending:false }).order("created_at",{ ascending:false })
    .limit(60);
  if(error){ return; }
  history = (data||[]).map(r=>({ name:r.plush_name, date:r.day, text:r.text }));
  renderHistory();
}

async function resetToday(){
  const name = $("nameInput").value.trim();
  const day = todayStr();
  if(!name){ toast("名前を入れてからやり直してね"); return; }
  const { error } = await sb.from("records").delete().eq("plush_name",name).eq("day",day);
  if(error){ toast("やり直しに失敗しました"); return; }
  $("result").classList.remove("show");
  await loadHistory();
  toast(`${name}の今日をリセットしました`);
}

/* ---- render ---- */
function renderHistory(){
  $("histBadge").textContent = history.length + "件";
  const el=$("histList");
  if(history.length===0){ el.innerHTML=`<p class="empty">まだ記録はありません。</p>`; return; }
  el.innerHTML="";
  history.forEach(h=>{
    const row=document.createElement("div"); row.className="hist-item";
    const left=document.createElement("span");
    left.innerHTML=`${escapeHtml(trimStop(h.text))}<span class="who2">${escapeHtml(h.name)}</span>`;
    const right=document.createElement("span"); right.className="date"; right.textContent=String(h.date).replace(/-/g,".");
    row.appendChild(left); row.appendChild(right); el.appendChild(row);
  });
}

/* 「××しているくまちゃん」の形にするため、行動文の末尾の句点だけを取り除きます。
   （！ や ？ は雰囲気が変わるので、あえて残しています） */
function trimStop(s){ return String(s).replace(/[。．.]+\s*$/, ""); }

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ---- events ---- */
function bindEvents(){
  $("drawBtn").addEventListener("click", draw);
  $("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") draw(); });
  $("resetTodayBtn").addEventListener("click", resetToday);
}

init();
</script>
</body>
</html>
