<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- このページはJavaScriptを一切使いません。CSPも通信先をフォントだけに絞っています。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
  font-src https://fonts.gstatic.com;
  img-src 'self' data:;
  base-uri 'none';
  form-action 'none';
" />
<title>ぬいについてのサイト</title>
<meta name="description" content="ぬいの「今日の様子」が届く「ぬい観察日記」と、1日のスケジュール表をつくれる「ぬいスケジュール」。おうちの子とすごす、ちいさなページです。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#efeaf6; --bg-2:#f6f1f9; --surface:#fffdf9; --ink:#4c4356; --muted:#9a8fa8;
    --berry:#e5738e; --berry-dk:#cf5c78; --sage:#8ab59b; --sage-dk:#6d9c82;
    --plum:#a98bc9; --plum-dk:#8566a8; --stitch:#d9c2e4;
    --line:#e7dced; --radius:22px; --shadow:0 10px 30px rgba(90,60,110,.10);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); color:var(--ink); line-height:1.8; -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #fbeef4 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 10%, #e9f3ec 0%, transparent 50%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  }
  .wrap{max-width:600px;margin:0 auto;padding:40px 18px 60px}

  /* ---- ヘッダー：サイト名だけを置いています ---- */
  header{text-align:center;margin-bottom:28px}
  .title{font-size:30px;font-weight:800;letter-spacing:.06em;margin:0}
  .title .dot{color:var(--berry)}

  /* ---- ふたつの入口 ---- */
  .menu{display:flex;flex-direction:column;gap:16px}
  .card{display:block;text-decoration:none;color:inherit;position:relative;
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:26px 24px 24px;
    transition:transform .12s ease,box-shadow .12s ease}
  .card::after{content:"";position:absolute;inset:7px;border:2px dashed var(--stitch);
    border-radius:calc(var(--radius) - 9px);pointer-events:none;transition:border-color .15s}
  .card > *{position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(90,60,110,.16)}
  .card:active{transform:translateY(0);box-shadow:var(--shadow)}
  .card:focus-visible{outline:3px solid var(--sage);outline-offset:3px}

  .card-name{font-size:22px;font-weight:800;letter-spacing:.04em;margin:0}
  .card-desc{margin:8px 0 0;font-size:14.5px;color:var(--ink)}
  .card-go{margin:14px 0 0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .card-go .arrow{transition:transform .15s}
  .card:hover .card-go .arrow{transform:translateX(4px)}

  /* 観察日記＝ベリー、スケジュール＝若葉。色で機能を覚えてもらう狙いです。 */
  .card.diary .card-name{color:var(--berry-dk)}
  .card.diary .card-go{color:var(--berry-dk)}
  .card.diary:hover::after{border-color:var(--berry)}
  .card.sched .card-name{color:var(--sage-dk)}
  .card.sched .card-go{color:var(--sage-dk)}
  .card.sched:hover::after{border-color:var(--sage)}
  /* お知らせは読み物なので、上の2つより控えめにしています。 */
  .card.board .card-name{color:var(--plum-dk)}
  .card.board .card-go{color:var(--plum-dk)}
  .card.board:hover::after{border-color:var(--plum)}

  .card.news{padding:20px 24px 18px}
  .card.news .card-name{color:var(--muted);font-size:18px}
  .card.news .card-desc{font-size:13.5px;color:var(--muted)}
  .card.news .card-go{color:var(--muted);font-size:13px;margin-top:10px}
  .card.news:hover::after{border-color:var(--stitch)}

  /* ---- フッターのリンク列。控えめな下線リンクにしています。 ---- */
  nav.links{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:0}
  nav.links a{font-size:13px;color:var(--muted);text-decoration:underline;
    text-underline-offset:4px;text-decoration-thickness:1px;transition:color .15s}
  nav.links a:hover{color:var(--berry-dk)}
  nav.links a:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:4px}
  footer{text-align:center;margin-top:34px}
  footer .sitename{color:var(--muted);font-size:12px;margin:14px 0 0;letter-spacing:.04em}

  @media (prefers-reduced-motion:reduce){
    .card,.card-go .arrow{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">ぬいについてのサイト<span class="dot">.</span></h1>
  </header>

  <main class="menu">
    <a class="card diary" href="diary.html">
      <p class="card-name">ぬい観察日記</p>
      <p class="card-desc">ぬいの名前を入れると、その子の「今日の様子」が一文だけ届きます。届いた文は、あなただけの記録として残ります。</p>
      <p class="card-go">観察する<span class="arrow">→</span></p>
    </a>

    <a class="card sched" href="schedule.html">
      <p class="card-name">ぬいスケジュール</p>
      <p class="card-desc">ぬいの1日の予定表をつくれます。時刻としていることを書き込んで、そのまま画像として保存できます。</p>
      <p class="card-go">つくる<span class="arrow">→</span></p>
    </a>

    <a class="card board" href="board.html">
      <p class="card-name">ぬい掲示板</p>
      <p class="card-desc">ひらがなだけで書きこめる、みんなの掲示板です。いたは300件たまるとつぎにうつります。</p>
      <p class="card-go">のぞく<span class="arrow">→</span></p>
    </a>

    <a class="card news" href="news.html">
      <p class="card-name">お知らせ</p>
      <p class="card-desc">新しくできたこと、これからのこと、規約の改定など。</p>
      <p class="card-go">よむ<span class="arrow">→</span></p>
    </a>
  </main>

  <footer>
    <nav class="links">
      <a href="about.html">このサイトについて</a>
      <a href="news.html">お知らせ</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
    </nav>
    <p class="sitename">ぬいについてのサイト</p>
  </footer>
</div>
</body>
</html>
